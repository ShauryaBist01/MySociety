{% extends 'base.html' %}

{% block title %}Sign In to My Society{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <!-- Login Card -->
            <div class="card shadow-lg border-0 overflow-hidden">
                <div class="card-header bg-dark-slate text-white text-center py-4 border-0">
                    <div class="brand-icon-wrapper mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.25rem;">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h4 class="fw-bold mb-1 text-white">Welcome Back</h4>
                    <p class="text-slate-400 small mb-0">Sign in to your society management dashboard</p>
                </div>

                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-slate-50 border-end-0 text-muted">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label mb-0">Password</label>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-slate-50 border-end-0 text-muted">
                                    <i class="fa-solid fa-key"></i>
                                </span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">
                                <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Account
                            </button>
                        </div>
                    </form>

                    <!-- Quick Demo Credentials Box -->
                    <div class="mt-4 p-3 bg-slate-50 rounded-3 border border-slate-200">
                        <div class="d-flex align-items-center gap-1 mb-2">
                            <i class="fa-solid fa-bolt text-warning small"></i>
                            <span class="fw-bold small text-slate-700">Quick 1-Click Demo Logins:</span>
                        </div>
                        <div class="d-flex gap-2">
                            <a href="{{ url_for('quick_login', role='president') }}" class="btn btn-outline-primary btn-sm flex-grow-1">
                                <i class="fa-solid fa-user-shield me-1"></i> President
                            </a>
                            <a href="{{ url_for('quick_login', role='member') }}" class="btn btn-outline-success btn-sm flex-grow-1">
                                <i class="fa-solid fa-user me-1"></i> Resident (Flat A-202)
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-slate-50 text-center py-3 border-top border-slate-100">
                    <p class="small text-muted mb-0">
                        Don't have an account yet? 
                        <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none">Create an Account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
